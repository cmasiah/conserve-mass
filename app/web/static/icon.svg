<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="space" cx="0.7" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#1d2b44"/><stop offset="0.55" stop-color="#0f1626"/><stop offset="1" stop-color="#070a12"/>
    </radialGradient>
    <radialGradient id="nebula" cx="0.25" cy="0.75" r="0.5">
      <stop offset="0" stop-color="#7a3fb0" stop-opacity=".45"/><stop offset="1" stop-color="#7a3fb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="0.25" stop-color="#9fe3ff" stop-opacity=".85"/>
      <stop offset="0.6" stop-color="#2f8fd1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2f8fd1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hullTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d2dc"/><stop offset="1" stop-color="#7d8895"/>
    </linearGradient>
    <linearGradient id="hullSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6773"/><stop offset="1" stop-color="#2c333c"/>
    </linearGradient>
    <linearGradient id="pod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c879"/><stop offset="1" stop-color="#b8701a"/>
    </linearGradient>
    <linearGradient id="thrust" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#bff0ff"/><stop offset="0.4" stop-color="#4fb3d9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#4fb3d9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="frame"><rect x="12" y="12" width="488" height="488" rx="92"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#space)"/>
    <rect width="512" height="512" fill="url(#nebula)"/>
    <!-- stars -->
    <g fill="#cfd8e6">
      <circle cx="60" cy="70" r="2"/><circle cx="140" cy="40" r="1.4"/><circle cx="300" cy="60" r="1.8"/>
      <circle cx="440" cy="110" r="1.4"/><circle cx="470" cy="300" r="2"/><circle cx="90" cy="250" r="1.3"/>
      <circle cx="40" cy="380" r="1.6"/><circle cx="210" cy="120" r="1.1"/><circle cx="380" cy="420" r="1.3"/>
      <circle cx="250" cy="455" r="1.6"/><circle cx="160" cy="330" r="1"/><circle cx="335" cy="140" r="1"/>
    </g>
    <!-- planet limb -->
    <circle cx="560" cy="560" r="230" fill="#13202f"/>
    <circle cx="560" cy="560" r="230" fill="none" stroke="#3d7fa8" stroke-width="3" opacity=".6"/>

    <!-- jump portal the freighter is exiting -->
    <ellipse cx="420" cy="215" rx="70" ry="120" fill="url(#portal)"/>
    <ellipse cx="420" cy="215" rx="46" ry="92" fill="none" stroke="#bff0ff" stroke-width="3" opacity=".7"/>
    <ellipse cx="420" cy="215" rx="62" ry="112" fill="none" stroke="#4fb3d9" stroke-width="2" opacity=".5" stroke-dasharray="6 10"/>

    <!-- original jump freighter: long spine, cargo pods, engine block, command bridge -->
    <g transform="translate(250 215) rotate(-12)">
      <!-- engine wash (trails behind, to the left) -->
      <path d="M-210 -18 L-330 -40 L-330 40 L-210 18 Z" fill="url(#thrust)" opacity=".9"/>
      <!-- engine block -->
      <rect x="-215" y="-34" width="52" height="68" rx="8" fill="url(#hullSide)" stroke="#1c2229" stroke-width="2"/>
      <circle cx="-215" cy="-16" r="9" fill="#bff0ff"/><circle cx="-215" cy="16" r="9" fill="#bff0ff"/>
      <!-- spine -->
      <rect x="-170" y="-10" width="330" height="20" rx="4" fill="url(#hullTop)" stroke="#2c333c" stroke-width="2"/>
      <!-- cargo pods: upper row -->
      <g stroke="#7a4a12" stroke-width="2">
        <rect x="-150" y="-46" width="62" height="34" rx="4" fill="url(#pod)"/>
        <rect x="-82"  y="-46" width="62" height="34" rx="4" fill="url(#pod)"/>
        <rect x="-14"  y="-46" width="62" height="34" rx="4" fill="url(#pod)"/>
        <rect x="54"   y="-46" width="62" height="34" rx="4" fill="url(#pod)"/>
        <!-- lower row -->
        <rect x="-150" y="12" width="62" height="34" rx="4" fill="url(#pod)"/>
        <rect x="-82"  y="12" width="62" height="34" rx="4" fill="url(#pod)"/>
        <rect x="-14"  y="12" width="62" height="34" rx="4" fill="url(#pod)"/>
        <rect x="54"   y="12" width="62" height="34" rx="4" fill="url(#pod)"/>
      </g>
      <!-- pod ribs -->
      <g stroke="#8a5313" stroke-width="2" opacity=".55">
        <line x1="-129" y1="-46" x2="-129" y2="-12"/><line x1="-108" y1="-46" x2="-108" y2="-12"/>
        <line x1="-61" y1="-46" x2="-61" y2="-12"/><line x1="-40" y1="-46" x2="-40" y2="-12"/>
        <line x1="7" y1="-46" x2="7" y2="-12"/><line x1="28" y1="-46" x2="28" y2="-12"/>
        <line x1="75" y1="-46" x2="75" y2="-12"/><line x1="96" y1="-46" x2="96" y2="-12"/>
        <line x1="-129" y1="12" x2="-129" y2="46"/><line x1="-108" y1="12" x2="-108" y2="46"/>
        <line x1="-61" y1="12" x2="-61" y2="46"/><line x1="-40" y1="12" x2="-40" y2="46"/>
        <line x1="7" y1="12" x2="7" y2="46"/><line x1="28" y1="12" x2="28" y2="46"/>
        <line x1="75" y1="12" x2="75" y2="46"/><line x1="96" y1="12" x2="96" y2="46"/>
      </g>
      <!-- command section with wedge prow -->
      <path d="M120 -30 L178 -22 L214 0 L178 22 L120 30 Z" fill="url(#hullTop)" stroke="#2c333c" stroke-width="2"/>
      <path d="M150 -10 L190 -4 L190 4 L150 10 Z" fill="#9fe3ff" opacity=".85"/>
      <!-- jump drive ring around the spine -->
      <ellipse cx="128" cy="0" rx="9" ry="40" fill="none" stroke="#4fb3d9" stroke-width="4"/>
      <!-- running lights -->
      <circle cx="-150" cy="-48" r="3" fill="#ff5a4e"/><circle cx="-150" cy="48" r="3" fill="#3fb950"/>
      <circle cx="208" cy="0" r="2.5" fill="#ffffff"/>
    </g>

    <!-- name plate -->
    <rect x="44" y="372" width="424" height="88" rx="18" fill="url(#plate)" stroke="#e8a33c" stroke-width="4" opacity=".95"/>
    <text x="256" y="430" text-anchor="middle"
          font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-weight="700"
          font-size="38" letter-spacing="3" textLength="372" lengthAdjust="spacingAndGlyphs" fill="#f3b75a">CONSERVE MASS</text>
  </g>
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="#2a3441" stroke-width="8"/>
</svg>

# Builds and publishes the image to GitHub Container Registry.
#   push to main  -> :latest, :<x.y.z> (APP_VERSION, for rollback), :sha-<commit>   (stable)
#                    + git tag v<x.y.z>
#   push to beta  -> :beta, :sha-<commit>                                          (beta)
#                    + git tag v<x.y.N>-beta, where N counts up with every merge
#   pull request  -> tests + a test build only; nothing is published
#
# Version numbers: APP_VERSION in app/config.py is set by hand only for a release
# (e.g. 0.7.0). Every merge into beta after that is the next number automatically:
# 0.7.1, 0.7.2, ... (APP_VERSION's patch + merges since the line last changed).
name: build-image

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write     # push the version tag (v0.7.3-beta / v0.7.0)
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — no secrets or data files in the repo
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]|\.db(-wal|-shm)?$|\.sqlite3$|(^|/)config/' || true)
          if [ -n "$bad" ]; then echo "Refusing to build, sensitive files tracked:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install & test
        run: |
          pip install -r requirements.txt pytest
          pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history: the beta number counts merges

      - name: Work out the version
        id: ver
        run: |
          base=$(grep -oP '^APP_VERSION = "\K[^"]+' app/config.py)
          if [ "$GITHUB_REF" = "refs/heads/beta" ]; then
            # Merges since APP_VERSION last changed, added to its patch number.
            since=$(git log -1 --format=%H -G '^APP_VERSION = ' -- app/config.py)
            n=$(git rev-list --count --first-parent "$since"..HEAD)
            IFS=. read -r major minor patch <<< "$base"
            version="$major.$minor.$((patch + n))"
            gittag="v$version-beta"
          else
            version="$base"
            gittag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "gittag=$gittag" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Image name (lowercase owner)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conserve-mass" >> "$GITHUB_OUTPUT"

      - name: Channel and tags
        id: tags
        env:
          IMG: ${{ steps.img.outputs.name }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          push=true
          if [ "$GITHUB_REF" = "refs/heads/beta" ]; then
            channel=beta
            tags="$IMG:beta"$'\n'"$IMG:sha-$GITHUB_SHA"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            channel=stable
            tags="$IMG:latest"$'\n'"$IMG:$VER"$'\n'"$IMG:sha-$GITHUB_SHA"
          else
            # pull requests and manual runs on other branches: build to test, never publish
            channel=test; push=false
            tags="$IMG:test"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          { echo "list<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            RELEASE_CHANNEL=${{ steps.tags.outputs.channel }}
            GIT_SHA=${{ github.sha }}
            BUILD_VERSION=${{ steps.tags.outputs.push == 'true' && steps.ver.outputs.version || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the commit with its version
        if: steps.tags.outputs.push == 'true'
        env:
          TAG: ${{ steps.ver.outputs.gittag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

# Builds the image on every push to main and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/conserve-mass:latest   (newest main)
#   ghcr.io/<owner>/conserve-mass:<x.y.z>   (APP_VERSION from app/config.py, for rollback)
#   ghcr.io/<owner>/conserve-mass:sha-<short>
name: build-image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — no secrets or data files in the repo
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]|\.db(-wal|-shm)?$|\.sqlite3$|(^|/)config/' || true)
          if [ -n "$bad" ]; then echo "Refusing to build, sensitive files tracked:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install & test
        run: |
          pip install -r requirements.txt pytest
          pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: ver
        run: echo "version=$(grep -oP '^APP_VERSION = "\K[^"]+' app/config.py)" >> "$GITHUB_OUTPUT"

      - name: Image name (lowercase owner)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conserve-mass" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

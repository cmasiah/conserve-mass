# Conserve Mass Ops — Docker Compose deployment (generic; no server-specific values).
#
# Your own settings live in two LOCAL files next to this one, which update.sh never
# touches and which are never committed:
#   .env                        CMASS_PORT, TZ, CMASS_APPDATA   (see deploy.env.example)
#   docker-compose.override.yml join your reverse-proxy network (see *.override.example.yml)
# Docker Compose reads both automatically.
#
# First run / update (from this folder):  bash update.sh
# Roll back: set image to a version tag, e.g. ghcr.io/cmasiah/conserve-mass:0.4.1
services:
  conserve-mass:
    image: ghcr.io/cmasiah/conserve-mass:latest
    # To build locally instead of pulling, uncomment:
    # build: .
    container_name: conserve-mass
    restart: unless-stopped
    environment:
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - UMASK=${UMASK:-022}
      - TZ=${TZ:-UTC}
    env_file:
      - ${CMASS_APPDATA:-/mnt/user/appdata/conserve-mass}/.env
    volumes:
      # On Unraid keep appdata cache-only with "Exclusive shares" enabled
      # (or point CMASS_APPDATA at /mnt/cache/...) — SQLite + FUSE don't mix.
      - ${CMASS_APPDATA:-/mnt/user/appdata/conserve-mass}:/config
    ports:
      - "${CMASS_PORT:-8000}:8000"
